auto-generated: true
indices:
  blog:
    include:
      - /blog/**
    target: /blog/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, "content")
      date:
        select: head > meta[name="publication-date"]
        value: |
          dateValue(attribute(el, 'content'), 'MM-DD-YYYY')
      lastModified:
        select: none
        value: |
          parseTimestamp(headers['last-modified'], 'ddd, DD MMM YYYY hh:mm:ss GMT')
      featured:
        select: head > meta[name="featured"]
        value: |
          attribute(el, "content")
      author:
        select: head > meta[name="author"]
        value: |
          attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: |
          match(attribute(el, "content"), "https:\/\/[^/]+(/.*)")
      content:
        select: main > div
        values: characters(textContent(el), 0, 200)
      tags:
        select: head > meta[property="article:tag"]
        values: |
          attribute(el, 'content')
  news:
    include:
      - /news/**
    target: /news/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, "content")
      subtitle:
        select: main h1 + h2
        value: |
          textContent(el)
      image:
        select: head > meta[property="og:image"]
        value: |
          match(attribute(el, "content"), "https:\/\/[^/]+(/.*)")
      collection:
        select: main .article-meta > div:first-child > div:first-child
        value: |
          textContent(el)
      date:
        select: head > meta[name="publication-date"]
        value: |
          attribute(el, "content")
      geography:
        select: head > meta[name="geography"]
        value: |
          attribute(el, "content")
  authors:
    include:
      - /author/**
    target: /author/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, "content")
